# Ethedor: compila o client (otclient_dx.exe e otclient_gl.exe) do branch "ethedor".
# O ci-cd.yml original usa windows-2019 e actions antigas que o GitHub ja aposentou; este roda em windows-2022
# com o toolset v143 e um vcpkg de 2024 (o commit de 2022 que o OTCv8 3.2 usava nao baixa mais: 7zip/msys2 sairam do ar).
# Resultado: aba Actions -> ultima execucao -> Artifacts -> "client-windows" (zip com os dois .exe).
name: Ethedor - client Windows

on:
  push:
    branches: [ ethedor ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VCPKG_ROOT: C:\vcpkg_ethedor
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg_cache
      VCPKG_COMMIT: 2024.07.12
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Cache dos pacotes do vcpkg
      uses: actions/cache@v4
      with:
        path: C:\vcpkg_cache
        key: vcpkg-x86-windows-static-${{ env.VCPKG_COMMIT }}-v2

    - name: vcpkg (bibliotecas do client)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
        git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
        cd $env:VCPKG_ROOT
        git checkout $env:VCPKG_COMMIT
        .\bootstrap-vcpkg.bat -disableMetrics
        .\vcpkg.exe install --triplet x86-windows-static boost-iostreams boost-asio boost-beast boost-system boost-variant boost-lockfree boost-process boost-program-options boost-uuid boost-filesystem luajit glew physfs openal-soft libogg libvorbis zlib libzip bzip2 openssl liblzma 2>&1 | Tee-Object -FilePath C:\vcpkg_saida.txt
        if ($LASTEXITCODE -ne 0) {
          # o log do Actions nao abre pela API para o Claude: manda o fim da saida como "anotacao" (essa a API mostra)
          $fim = (Get-Content C:\vcpkg_saida.txt -Tail 70) -join '%0A'
          Write-Host "::error title=vcpkg::$fim"
          Get-ChildItem "$env:VCPKG_ROOT\buildtrees" -Recurse -Filter "*-err.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 3 | ForEach-Object {
            $t = (Get-Content $_.FullName -Tail 40) -join '%0A'
            Write-Host "::error title=$($_.Name)::$t"
          }
          throw "vcpkg install falhou"
        }
        .\vcpkg.exe integrate install

    - name: Compilar
      shell: pwsh
      run: |
        cd vc16
        MSBuild otclient.sln /m /property:Configuration=DirectX /property:Platform=Win32 /p:PlatformToolset=v143 /p:BUILD_REVISION=${{ github.run_number }}
        if ($LASTEXITCODE -ne 0) { throw "DirectX falhou" }
        MSBuild otclient.sln /m /property:Configuration=OpenGL /property:Platform=Win32 /p:PlatformToolset=v143 /p:BUILD_REVISION=${{ github.run_number }}
        if ($LASTEXITCODE -ne 0) { throw "OpenGL falhou" }
        cd ..
        Get-ChildItem -Filter "otclient_*.exe" | Format-Table Name, Length

    - name: Enviar os .exe
      uses: actions/upload-artifact@v4
      with:
        name: client-windows
        path: |
          otclient_dx.exe
          otclient_gl.exe
        if-no-files-found: error
